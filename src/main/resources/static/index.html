<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSearch</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: arial, sans-serif;
            background: #fff;
            color: #202124;
        }

        .google-header {
            background: #fff;
            border-bottom: 1px solid #ebebeb;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 28px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .google-logo {
            font-size: 26px;
            font-weight: 500;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #4285f4, #ea4335, #fbbc05, #34a853);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        .search-wrapper {
            flex: 1;
            max-width: 692px;
        }

        .google-search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 5px 8px 5px 14px;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .google-search-box:hover,
        .google-search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-icon {
            color: #9aa0a6;
            margin-right: 12px;
            font-size: 18px;
        }

        .search-input {
            flex: 1;
            border: none;
            font-size: 16px;
            padding: 12px 0;
            outline: none;
            background: transparent;
            font-family: arial, sans-serif;
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .clear-icon, .mic-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #70757a;
            font-size: 16px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
        }

        .mic-icon.listening {
            color: #ea4335;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .search-btn-icon {
            background: transparent;
            border: none;
            border-radius: 22px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 500;
            color: #4285f4;
            cursor: pointer;
        }

        .search-btn-icon:hover { background: #f8f9fa; }

        .main-container {
            max-width: 652px;
            margin: 28px auto 40px;
            padding: 0 20px;
        }

        .stats-info {
            font-size: 14px;
            color: #70757a;
            margin-bottom: 24px;
        }

        .ai-summary {
            background: #f0f4ff;
            border-radius: 18px;
            padding: 20px 24px;
            margin-bottom: 32px;
            border: 1px solid #d2e3fc;
        }

        .ai-summary h3 {
            font-size: 15px;
            font-weight: 500;
            color: #1a73e8;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-summary p {
            font-size: 14px;
            line-height: 1.6;
            color: #202124;
        }

        .g-result {
            margin-bottom: 32px;
            word-wrap: break-word;
        }

        .result-url-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .result-url-text {
            font-size: 13px;
            color: #4d5156;
        }

        .result-title {
            font-size: 20px;
            font-weight: normal;
            line-height: 1.3;
            margin-bottom: 5px;
        }

        .result-title a {
            color: #1a0dab;
            text-decoration: none;
        }

        .result-title a:hover { text-decoration: underline; }

        .result-snippet {
            font-size: 14px;
            color: #4d5156;
            line-height: 1.58;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 40px 0 30px;
        }

        .pagination button {
            background: #fff;
            border: 1px solid #dadce0;
            border-radius: 4px;
            padding: 8px 20px;
            font-size: 14px;
            font-family: arial, sans-serif;
            color: #3c4043;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            background: #f8f9fa;
            border-color: #c6c9ce;
        }

        .pagination button:disabled { opacity: 0.4; cursor: default; }
        .pagination span { font-size: 14px; color: #70757a; }

        .error-message {
            background: #fce8e6;
            border-radius: 8px;
            padding: 16px;
            color: #c5221f;
            font-size: 14px;
            border-left: 4px solid #c5221f;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px 0;
            color: #70757a;
            font-size: 14px;
        }

        .no-results {
            text-align: center;
            padding: 60px 0;
            color: #70757a;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .google-header { flex-wrap: wrap; gap: 12px; padding: 12px 16px; }
            .main-container { padding: 0 16px; }
            .result-title { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="google-header">
    <div class="logo-area" onclick="resetToHome()">
        <div class="google-logo">
            <span>G</span><span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span>
        </div>
    </div>
    <div class="search-wrapper">
        <div class="google-search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="queryInput" class="search-input"
                   placeholder="Search GSearch..." autocomplete="off">
            <div class="search-actions">
                <button class="clear-icon" id="clearBtn" style="display:none">✕</button>
                <button class="mic-icon" id="micBtn">🎤</button>
                <button class="search-btn-icon" onclick="newSearch()">Search</button>
            </div>
        </div>
    </div>
</div>

<div class="main-container" id="main"></div>

<script>
    // ── State ──────────────────────────────────────────────
    let currentPage = 0;
    let currentQuery = '';
    const pageSize = 10;

    // ── DOM references ─────────────────────────────────────
    const queryInput = document.getElementById('queryInput');
    const clearBtn   = document.getElementById('clearBtn');
    const micBtn     = document.getElementById('micBtn');
    const main       = document.getElementById('main');

    // ── Clear button: show/hide as user types ──────────────
    queryInput.addEventListener('input', function() {
        clearBtn.style.display = queryInput.value.length > 0 ? 'flex' : 'none';
    });

    clearBtn.addEventListener('click', function() {
        queryInput.value = '';
        clearBtn.style.display = 'none';
        queryInput.focus();
    });

    // ── Enter key triggers search ──────────────────────────
    queryInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') newSearch();
    });

    // ── Mic button: voice search ───────────────────────────
    micBtn.addEventListener('click', function() {

        // check if browser supports voice
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert('Voice search is only supported on Chrome or Edge.');
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.start();

        // mic turns red and pulses while listening
        micBtn.classList.add('listening');

        // when user finishes speaking
        recognition.onresult = function(event) {
            const spokenText = event.results[0][0].transcript;
            queryInput.value = spokenText;
            clearBtn.style.display = 'flex';
            micBtn.classList.remove('listening');
            newSearch(); // automatically search what was spoken
        };

        // if something goes wrong
        recognition.onerror = function(e) {
            micBtn.classList.remove('listening');
            console.error('Voice error:', e.error);
        };

        // when recognition ends (even without result)
        recognition.onend = function() {
            micBtn.classList.remove('listening');
        };
    });

    // ── Logo click: reset to home ──────────────────────────
    function resetToHome() {
        main.innerHTML = '';
        queryInput.value = '';
        clearBtn.style.display = 'none';
        queryInput.focus();
    }

    // ── New search (resets to page 0) ──────────────────────
    function newSearch() {
        const query = queryInput.value.trim();
        if (!query) return;
        currentQuery = query;
        currentPage = 0;
        search();
    }

    // ── Fetch results from backend ─────────────────────────
    async function search() {
        main.innerHTML = '<div class="loading-spinner">Searching...</div>';

        try {
            const url = `/api/search?query=${encodeURIComponent(currentQuery)}&page=${currentPage}&size=${pageSize}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('Server returned ' + response.status);
            const data = await response.json();
            render(data);
        } catch (err) {
            main.innerHTML = `<div class="error-message">⚠️ Something went wrong: ${err.message}</div>`;
        }
    }

    // ── Render results to page ─────────────────────────────
    function render(data) {

        // no results case
        if (!data.results || data.results.length === 0) {
            main.innerHTML = `<div class="no-results">No results found for <strong>"${escapeHtml(data.query)}"</strong></div>`;
            return;
        }

        const totalPages = Math.max(1, Math.ceil(data.totalResults / pageSize));
        const isLastPage = (currentPage + 1) >= totalPages;

        let html = '';

        // stats line
        const start = currentPage * pageSize + 1;
        const end   = Math.min((currentPage + 1) * pageSize, data.totalResults);
        html += `<div class="stats-info">About ${data.totalResults.toLocaleString()} results (${start}–${end})</div>`;

        // AI summary block
        if (data.aiSummary && data.aiSummary.trim()) {
            html += `
                <div class="ai-summary">
                    <h3>✨ AI Overview</h3>
                    <p>${escapeHtml(data.aiSummary)}</p>
                </div>`;
        }

        // result cards
        data.results.forEach(function(result) {

            // get favicon from Google's favicon service
            let faviconHtml = '';
            try {
                const hostname = new URL(result.url).hostname;
                faviconHtml = `<img src="https://www.google.com/s2/favicons?domain=${hostname}"
                                    width="16" height="16"
                                    onerror="this.style.display='none'"
                                    style="border-radius:2px">`;
            } catch(e) {
                faviconHtml = '🔗';
            }

            const displayUrl = result.url.replace(/^https?:\/\//, '');

            html += `
                <div class="g-result">
                    <div class="result-url-row">
                        ${faviconHtml}
                        <span class="result-url-text">${escapeHtml(displayUrl)}</span>
                    </div>
                    <div class="result-title">
                        <a href="${escapeHtmlAttr(result.url)}" target="_blank">${escapeHtml(result.title)}</a>
                    </div>
                    <div class="result-snippet">${escapeHtml(result.snippet || '')}</div>
                </div>`;
        });

        // pagination buttons
        html += `
            <div class="pagination">
                <button onclick="prevPage()" ${currentPage === 0 ? 'disabled' : ''}>← Previous</button>
                <span>Page ${currentPage + 1} of ${totalPages}</span>
                <button onclick="nextPage()" ${isLastPage ? 'disabled' : ''}>Next →</button>
            </div>`;

        main.innerHTML = html;
    }

    // ── Pagination ─────────────────────────────────────────
    function prevPage() {
        if (currentPage > 0) {
            currentPage--;
            search();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function nextPage() {
        currentPage++;
        search();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── Security helpers ───────────────────────────────────
    // prevents XSS — never put raw text into innerHTML without this
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    // for escaping URLs in href attributes
    function escapeHtmlAttr(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;');
    }

    // ── Auto focus search box on load ──────────────────────
    queryInput.focus();
</script>
</body>
</html>
